services:
  - type: web
    name: erp
    runtime: php

    plan: free

    buildCommand: |
      composer install --no-dev --optimize-autoloader

    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: false

      - key: APP_URL
        value: https://erp.onrender.com