services:
  erp:
    build:
      context: ./erp
      dockerfile: Dockerfile
    container_name: erp_app
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      APP_NAME: "Magnolias"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://magnolias.taild6fc8e.ts.net
      APP_TIMEZONE: America/Sao_Paulo
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR

      LOG_CHANNEL: stack
      LOG_STACK: daily
      LOG_LEVEL: warning
      LOG_DAILY_DAYS: "14"

      DB_CONNECTION: mysql
      DB_HOST: erp_mysql
      DB_PORT: "3306"
      DB_DATABASE: erp_magnolias
      DB_USERNAME: magnolias_user
      DB_PASSWORD: ${MAGNOLIAS_DB_PASSWORD}

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SESSION_HTTP_ONLY: "true"

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log
      MAIL_MAILER: log
      BCRYPT_ROUNDS: "12"
    volumes:
      - erp_storage:/app/storage
    depends_on:
      erp_mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - erp_network

  erp_mysql:
    image: mysql:8.4
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD}
    volumes:
      - erp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERP_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp_network

networks:
  erp_network:
    name: erp_network

volumes:
  erp_mysql_data:
    name: erp_mysql_data
  erp_storage:
    name: erp_storage
